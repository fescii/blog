baseURL = 'https://femar.aduki.org/'
languageCode = 'en-us'
title = 'Femar'

enableRobotsTXT = true

[markup.highlight]
  style = "monokai"
  lineNos = false
  lineNumbersInTable = false
  noClasses = false
  tabWidth = 2

[params]
  author = "Fredrick Femar"
  description = "A premium blog powered by Hugo."
  colorScheme = "auto"
  hideColorSchemeToggle = false
  customSCSS = ["scss/custom.scss"]
  customJS = ["js/custom.js"]

  activeTheme = "midnight_hearth"
  avatarURL = "images/me.jpg"
  
  [[params.social]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    url = "https://github.com/fescii"
    weight = 1
  
  [[params.social]]
    name = "X"
    icon = "fa-brands fa-x-twitter"
    url = "https://x.com/fescii"
    weight = 2
  
  [[params.social]]
    name = "LinkedIn"
    icon = "fa-brands fa-linkedin"
    url = "https://linkedin.com/in/iamfemar"
    weight = 3

  [params.giscus]
    repo = "fescii/femar"
    repoId = "R_kgDOXXXXXX"
    category = "Announcements"
    categoryId = "DIC_kwDOXXXXXX"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "en"
    loading = "lazy"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[[menu.main]]
  name = "About"
  weight = 1
  url = "/about/"

[[menu.main]]
  name = "Posts"
  weight = 2
  url = "/posts/"

[[menu.main]]
  name = "Projects"
  weight = 3
  url = "/projects/"

[[menu.main]]
  name = "Contact"
  weight = 4
  url = "/contact/"
